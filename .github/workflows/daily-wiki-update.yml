name: Daily Wiki Update

on:
  schedule:
    - cron: '59 23 * * 1-5'       # 23:59 UTC Mon-Fri
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to summarise (YYYY-MM-DD)'
        required: false
        default: ''
      summary_style:
        description: 'Summary style'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - narrative
          - bullets
      summary_word_limit:
        description: 'Max words for narrative (e.g. 130)'
        required: false
        default: ''
      summary_bullet_count:
        description: 'Number of bullet points (e.g. 5)'
        required: false
        default: ''

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout scripts (default branch to read config)
        uses: actions/checkout@v5

      - name: Determine automation branch
        id: branch
        run: |
          # Read branch from config.yml, fall back to vars.AUTOMATION_BRANCH, then current ref
          CFG_BRANCH=$(grep -m1 '^branch:' config.yml 2>/dev/null | awk '{print $2}' | tr -d '\r')
          BRANCH="${CFG_BRANCH:-${{ vars.AUTOMATION_BRANCH || github.ref_name }}}"
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout automation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.branch.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Generate daily summary
        env:
          GH_TOKEN: ${{ secrets.WIKI_PAT }}
          GITHUB_ACTOR: ${{ vars.GITHUB_ACTOR || github.repository_owner }}
          SUMMARY_DATE: ${{ inputs.date }}
          SUMMARY_STYLE: ${{ (inputs.summary_style == 'narrative' || inputs.summary_style == 'bullets') && inputs.summary_style || '' }}
          SUMMARY_WORD_LIMIT: ${{ inputs.summary_word_limit }}
          SUMMARY_BULLET_COUNT: ${{ inputs.summary_bullet_count }}
          # OpenAI (or any OpenAI-compatible) API key for narrative generation.
          # GitHub Models was retired 2026-07-30; without this key the script
          # falls back to a deterministic template. Optionally override LLM_MODEL.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python generate_daily_summary.py

      - name: Push to wiki
        env:
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${WIKI_PAT}@github.com/${REPO}.wiki.git wiki
          cd wiki

          if [ ! -f Daily-Updates.md ]; then
            printf '# Daily Updates\n\nAutomatically generated daily activity summaries.\n\n---\n\n' \
              > Daily-Updates.md
          fi

          # Insert entry at the correct chronological position (newest first)
          python3 ../dedup_wiki.py ../daily_summary_patch.md Daily-Updates.md

          if ! grep -q 'Daily-Updates' _Sidebar.md; then
            printf '\n* [[Daily Updates|Daily-Updates]]\n' >> _Sidebar.md
          fi

          git add Daily-Updates.md _Sidebar.md
          git diff --cached --quiet \
            || (git commit -m "Daily wiki update: $(date -u +%Y-%m-%d)" && git pull --rebase origin master && git push)
